name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests never load the embedding model, so CI skips sentence-transformers (and its large torch download).
      - run: pip install certifi rank_bm25 numpy pytest ruff fastapi "uvicorn[standard]" httpx
      - run: ruff check . && ruff format --check .
      - uses: actions/cache@v4
        with:
          path: .cache/datasets
          key: beir-datasets-v1
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
